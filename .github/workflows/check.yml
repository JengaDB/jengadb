name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python scripts/team.py check
  rgbd:
    # The RGB-D tests skip without numpy/Pillow in the baseline job; here they must execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[rgbd]'
      - run: RGBD_TESTS_REQUIRED=1 python -m unittest tests.test_rgbd_pipeline -v
